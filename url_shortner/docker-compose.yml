services:

  db:
    image: postgres:18
    container_name: smolurl-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortner

    volumes:
      - postgres_data:/var/lib/postgresql

      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    ports:
      - "5432:5432"


  app:
    build: .
    container_name: smolurl-app

    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/url_shortner

    ports:
      - "8080:8080"

    depends_on:
      - db


volumes:
  postgres_data: